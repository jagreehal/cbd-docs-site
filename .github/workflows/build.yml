name: build
on:
  push:
    branches: [main]
  # Hourly, half an hour after cbd-catalog builds, so the manifest copy keeps up.
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages serves 404.html for any path it does not have, so every
      # old page redirects to the same path on cbd-catalog.
      - run: cp public/index.html public/404.html
      # A redirect page cannot stand in for JSON. Docs checks pinned to
      # cbd-handbook v1.0.0 still read the manifest here, so keep a copy.
      - run: >-
          curl -fsS --create-dirs -o public/contracts/docs-manifest.json
          https://jagreehal.github.io/cbd-catalog/contracts/docs-manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
